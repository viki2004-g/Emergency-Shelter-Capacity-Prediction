{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">500</div>
  <div class="error-title">Internal Server Error</div>
  <p class="error-desc">
    An unexpected error occurred while processing your request.<br>
    The incident has been logged for system administrators. Please try again later.
  </p>
  <div class="mt-4">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-sm me-2">
      <i class="bi bi-house-door me-1"></i>Return to Safety Portal
    </a>
  </div>
</div>
{% endblock %}
